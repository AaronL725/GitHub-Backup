[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-backup-controller"
version = "1.0.0"
description = "Private GitHub replicas and readable versioned Google Drive backups"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ghbackup = "ghbackup.cli:main"

[tool.setuptools]
packages = ["ghbackup"]
